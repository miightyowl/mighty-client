name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            cmake-args: -G Ninja -DVIDEORECORDER=OFF
            package-file: "*-linux_x86_64.tar.xz"
          - name: macos
            os: macos-latest
            cmake-args: -G Ninja
            package-file: "*-macos.dmg"
          - name: windows
            os: windows-latest
            cmake-args: -A x64 -DEXCEPTION_HANDLING=ON -DVULKAN=ON
            package-file: "*-win64.zip"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare Linux
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            glslang-tools libfreetype6-dev libglew-dev libnotify-dev libpng-dev \
            libsdl2-dev libsqlite3-dev libvulkan-dev ninja-build pkg-config

      - name: Prepare macOS
        if: contains(matrix.os, 'macos')
        run: |
          brew update
          brew install ffmpeg molten-vk ninja pkg-config sdl2
          brew upgrade freetype
          pip3 install --break-system-packages dmgbuild
          echo /Library/Frameworks/Python.framework/Versions/3.12/bin >> $GITHUB_PATH
          sudo rm -rf /Library/Developer/CommandLineTools

      - name: Install Vulkan SDK (Windows)
        if: contains(matrix.os, 'windows')
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.296.0
          cache: true

      - name: Configure and build (Release)
        run: |
          mkdir release
          cd release
          cmake ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. ..
          cmake --build . --config Release --target everything

      - name: Package
        run: |
          cd release
          cmake --build . --config Release --target package_default
          mkdir artifacts
          mv ${{ matrix.package-file }} artifacts

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mclient-${{ matrix.name }}
          path: release/artifacts
          if-no-files-found: error

      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/artifacts/*
          fail_on_unmatched_files: true

  build-android:
    runs-on: ubuntu-24.04
    env:
      CARGO_HTTP_MULTIPLEXING: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Prepare Linux
        run: |
          sudo apt-get update -y
          sudo apt-get install ninja-build openjdk-21-jdk openssl
          curl -LO https://github.com/Kitware/CMake/releases/download/v3.22.1/cmake-3.22.1-Linux-x86_64.tar.gz
          mkdir -p /home/runner/cmake
          tar --strip-components 1 -C /home/runner/cmake -xf cmake-3.22.1-Linux-x86_64.tar.gz
          rustup default 1.92.0
          cargo install cargo-ndk
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android
          scripts/android/download_android_sdk.sh /home/runner

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.296.0
          cache: true

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false # WORKAROUND(https://github.com/Swatinem/rust-cache/issues/341)
          workspaces: |
            src/mastersrv
            src/masterping
            ./

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /home/runner/MClient.jks
            echo "TW_KEY_PW=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "TW_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, signing with a throwaway key. Users cannot upgrade over a previous install and must uninstall first."
            KEY_PW="$(openssl rand -base64 32)"
            keytool -genkey -v -keystore /home/runner/MClient.jks -keyalg RSA -keysize 2048 -validity 10000 \
              -alias MClient-Key -storepass "$KEY_PW" -dname "CN=M-Client CI, OU=M-Client, O=M-Client"
            echo "::add-mask::$KEY_PW"
            echo "TW_KEY_PW=$KEY_PW" >> $GITHUB_ENV
            echo "TW_KEY_ALIAS=MClient-Key" >> $GITHUB_ENV
          fi

      - name: Build Android app
        env:
          TW_KEY_NAME: /home/runner/MClient.jks
        run: |
          export ANDROID_HOME="/home/runner/Android/Sdk"
          unset ANDROID_SDK_ROOT
          export PATH=/home/runner/cmake/bin:$PATH
          MCLIENT_VERSION="$(grep '#define MCLIENT_VERSION' src/game/version.h | cut -d'"' -f2)"
          export TW_VERSION_NAME="$MCLIENT_VERSION"
          export TW_VERSION_CODE="$(echo "$MCLIENT_VERSION" | awk -F. '{print $1 * 10000 + $2 * 100 + $3}')"
          scripts/android/cmake_android.sh all MClient org.mighty.client Release build-android
          mkdir artifacts
          mv build-android/MClient.apk artifacts

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mclient-android
          path: artifacts
          if-no-files-found: error

      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
